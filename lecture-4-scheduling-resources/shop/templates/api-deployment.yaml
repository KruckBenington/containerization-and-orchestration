apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: shop-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
    spec:
      priorityClassName: {{ .Values.api.priorityClassName | default "default" }}
      {{- if .Values.api.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpread.maxSkew }}
          topologyKey: {{ .Values.api.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.api.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shop-api
      {{- end }}
      {{- if .Values.api.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: shop-api
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HEALTH_FAIL
              value: "{{ .Values.api.env.healthFail }}"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-app
                  key: password
            - name: DATABASE_URL
              value: "host=shop-postgres-rw user=app password=$(PG_PASSWORD) dbname=app sslmode=disable"
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.api.resources.requests.cpu | quote }}
              memory: {{ .Values.api.resources.requests.memory | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
