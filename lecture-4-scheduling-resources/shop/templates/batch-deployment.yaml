apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-batch
  labels:
    app.kubernetes.io/name: shop-batch
spec:
  replicas: {{ .Values.batch.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-batch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-batch
    spec:
      priorityClassName: {{ .Values.batch.priorityClassName | default "default" }}
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          args: {{ toJson .Values.batch.args }}
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: {{ .Values.batch.resources.requests.cpu | quote }}
              memory: {{ .Values.batch.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.batch.resources.limits.cpu | quote }}
              memory: {{ .Values.batch.resources.limits.memory | quote }}
