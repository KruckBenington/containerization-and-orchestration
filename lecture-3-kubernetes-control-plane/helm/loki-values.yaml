deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: storage
      emptyDir: {}
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

loki:
  useTestSchema: true
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  ruler:
    enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
