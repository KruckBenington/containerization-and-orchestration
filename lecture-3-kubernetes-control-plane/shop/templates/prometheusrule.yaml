apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-api-rules
  namespace: default
  labels:
    release: prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: shop-api-alerts
      rules:
        - alert: HighHttpErrorRate
          expr: (sum(rate(http_requests_total{job="shop-api",code=~"5.."}[2m])) / sum(rate(http_requests_total{job="shop-api"}[2m])) * 100) > 10
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "High HTTP 5xx error rate on shop-api"
            description: "5xx error rate exceeds 10% for the last 2 minutes"

        - alert: HighLatencyP95
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="shop-api"}[2m]))) > 1.0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "High latency p95 on shop-api"
            description: "95% of requests take more than 1 second over 2 minutes"

        - alert: ServiceDown
          expr: up{job="shop-api"} == 0 or absent(up{job="shop-api"}) == 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Service shop-api is down"
            description: "Prometheus cannot scrape metrics from shop-api pod"
