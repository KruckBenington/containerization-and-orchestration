apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: shop-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HEALTH_FAIL
              value: "{{ .Values.api.env.healthFail }}"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-app
                  key: password
            - name: DATABASE_URL
              value: "host=shop-postgres-rw user=app password=$(PG_PASSWORD) dbname=app sslmode=disable"
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
